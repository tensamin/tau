[package]
name = "tau-relay-protocol"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:mtp-crypto", "dep:getrandom"]

[dependencies]
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "eef7562be64e77d8c29ba5af6df7596073e3c9f2", default-features = false, features = ["crypto"] }
mtp-type-map = { git = "https://github.com/Nonanium/MTP.git", rev = "eef7562be64e77d8c29ba5af6df7596073e3c9f2", features = ["registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }
mtp-crypto = { git = "https://github.com/Nonanium/MTP.git", rev = "eef7562be64e77d8c29ba5af6df7596073e3c9f2", features = ["wasm"], optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
